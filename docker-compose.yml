# Local full stack: PostgreSQL + API (which also serves the built React app).
#   docker compose up --build   →  http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lms:lms@db:5432/lms
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      CLIENT_ORIGIN: http://localhost:4000
      COOKIE_SECURE: 'false' # plain http locally
      UPLOAD_DIR: /data/uploads
    ports:
      - '4000:4000'
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
