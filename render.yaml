# Render Blueprint: one Node web service (API serves the built React app) + managed PostgreSQL.
# New → Blueprint → pick this repo. JWT secrets are generated automatically.
services:
  - type: web
    name: loandesk
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: loandesk-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: loandesk-db
    plan: free
    databaseName: lms
    user: lms
