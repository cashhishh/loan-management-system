# Render Blueprint: one Docker web service + a managed PostgreSQL database.
# New → Blueprint → pick this repo. Secrets are generated automatically.
services:
  - type: web
    name: loandesk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loandesk-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://loandesk.onrender.com

databases:
  - name: loandesk-db
    plan: free
    databaseName: lms
    user: lms
